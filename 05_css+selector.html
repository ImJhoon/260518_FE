<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* 태그 선택자 */
      p {
        color: red;
      }

      .class-style {
        color: blue;
      }

      .class-style2 {
        color: green;
      }

      #id-style {
        color: yellow;
      }
    </style>
    <title>css 선택자</title>
  </head>
  <body>
    <p>태그 선택자</p>
    <!-- emmet -->
    <!-- p.class-style -->
    <p class="class-style">클래스 선택자</p>
    <p class="class-style class-style2">클래스 선택자</p>
    <!-- id 선택자 -->
    <p id="id-style">id 선택자</p>
  </body>
</html>
